<!DOCTYPE html>
<html lang="en">

<head>
    <title>HTML Lists</title>
</head>

<body>

    <h1>HTML Lists</h1>

    <h2>A. Unordered List</h2>

    <h3>Favorite Foods</h3>

    <ul>
        <li>Pizza</li>
        <li>Burger</li>
        <li>Fried Chicken</li>
        <li>French Fries</li>
        <li>Ice Cream</li>
    </ul>

    <h2>B. Ordered List</h2>

    <h3>Top 5 Programming Languages</h3>

    <ol>
        <li>JavaScript</li>
        <li>Python</li>
        <li>Java</li>
        <li>PHP</li>
        <li>C#</li>
    </ol>

</body>

</html>
